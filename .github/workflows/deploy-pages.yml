name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "battles/**"
      - "agents/**"
      - "static-site/**"
      - "src/AgentBattle.SiteGenerator/**"
      - "src/AgentBattle.Web.Core/**"
      - "src/AgentBattle.Domain/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate site data (battles, agents, stats manifests)
        run: |
          dotnet run --project src/AgentBattle.SiteGenerator -- \
            --battles-dir battles \
            --agents-dir agents \
            --out-dir static-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
